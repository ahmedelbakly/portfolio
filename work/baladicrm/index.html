    <script>
      // Resolve the theme before first paint so the page never flashes the
      // wrong background. Mirrors the logic in src/theme/ThemeProvider.tsx.
      ;(function () {
        try {
          var stored = localStorage.getItem('ae-theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme

          var lang = localStorage.getItem('ae-lang')
          if (lang === 'ar') {
            document.documentElement.lang = 'ar'
            document.documentElement.dir = 'rtl'
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
